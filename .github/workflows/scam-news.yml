# Fetches Google News headlines and commits scam-news.json to this repo.
# vocaguard.com reads it from raw.githubusercontent.com (no token needed: repo is public).
name: Scam news headlines

on:
  schedule:
    - cron: "23 */3 * * *" # every 3 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scam-news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Fetch headlines
        run: python3 fetch_scam_news.py scam-news.json scam-news.json

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scam-news.json
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -q -m "Update scam news headlines"
          git push -q
